<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Productivity Vault</title>
</head>
<body>
    <!--APP HEADER-->
    <h1 class="app-header">Productivity Vault</h1>


    <button class="sidebar-toggle" id="sidebarToggle">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <!--APP WRAPPER-->
    <div id="app">

        <!--SIDEBAR-->
        <aside class="sidebar">

            <section class="sidebar-section">
                <header>
                    <h2>PERFORMANCE</h2>
                </header>
                <div id="performance-overview"></div>
            </section>

            <!--QUICK ACTION-->
            <section class="sidebar-section">
                <header>
                    <h2>📌 QUICK-ACTION</h2>
                </header>
                <button id="openHabitModal">+ Add New Habit</button>
                <button id="openTaskModal">+ Add New Task</button>
                <button id="openProjectModal">+ Add New Project</button>

            </section>

            <!--NAVIGATION-->
            <section class="sidebar-section">
                <header>
                    <h2>📌 NAVIGATION</h2>
                </header>
                <nav class="nav-links">
                    <button class="nav-btn" data-target="trackhabit_grid">📊 Habit Report</button>
                    <button class="nav-btn" data-target="habit-stat">🗂 Habit Statistics</button>
                    <button class="nav-btn" data-target="project-grid">🎯 Goals & Projects</button>
                    <button class="nav-btn" data-target="habit_grid">📅 Habit Logs</button>
                </nav>
            </section>

            <!--HABIT STATS-->
           <section class="sidebar-section">
                <header>
                    <h2>〽 HABIT-STATISTIC</h2>
                </header>
                <header>
                    <h3>Habit stats</h3>
                </header>
                <div class="habit-stat" id="habit-stat"></div>
            </section>

        </aside>


        <!--MAIN CONTENT-->
        <main class="main-content">

            <!--HABIT STREAK & GOALS-->
            <section class="panel">
                <header>
                    <h2>📆 HABIT - STREAK & 🎯 GOAL - TRACKING</h2>
                </header>
                <header>
                    <h3>Habits</h3>
                </header>

                <div class="habit_grid" id="habit_grid">
                </div>
            </section>
            <!--DAILY HABIT TRACKING-->
            <section class="panel">
                <header>
                    <h2>📆 DAILY - HABIT - TRACKING</h2>
                </header>
                <header>
                    <h3>Habits</h3>
                </header>
                <div class="habit_grid" id="trackhabit_grid">
                    <template id="day-labels-template">
                        <div class="day-labels">
                                <span>Sun</span>
                                <span>Mon</span>
                                <span>Tue</span>
                                <span>Wed</span>
                                <span>Thu</span>
                                <span>Fri</span>
                                <span>Sat</span>
                        </div>
                    </template>
                </div>

            </section>


            <!--TASKS-->
            <section class="panel">
                <header>
                    <h2>💾 TASKS</h2>
                </header>
                <div class="task-filter-menu">
                    <button class="task-filter-btn task-filter-btn--active" data-filter="all">All</button>
                    <button class="task-filter-btn" data-filter="today">Today</button>
                    <button class="task-filter-btn" data-filter="week">This week</button>
                    <button class="task-filter-btn" data-filter="completed">Completed</button>
                    <button class="task-filter-btn" data-filter="archive">Archive 🗂</button>
                </div>
                <div class="task-columns" id="task-grid"></div>
            </section>


            <!--PROJECT MANAGER-->
            <section class="panel">
                <header>
                    <h2>📁 PROJECT - MANAGER</h2>
                </header>
                <div class="task-filter-menu">
                    <button class="project-filter-btn project-filter-btn--active" data-filter="active">Active</button>
                    <button class="project-filter-btn" data-filter="completed">Completed</button>
                    <button class="project-filter-btn" data-filter="archive">Archive 🗂</button>
                </div>
                <div class="project-grid" id="project-grid"></div>
            </section>

            <!--CALENDAR-->
            <section class="panel">
                <header>
                    <h2>📆 WEEKLY - & - MONTHLY - CALENDAR</h2>
                </header>
                <p class="calendar-month-label" id="calendar-month-label"></p>
                <div class="calendar-grid" id="calendar-grid"></div>
            </section>

        </main>

    </div>
    <!--Add Habit form-->
    <div class="modal" id="habitModal">
        <div class="modal-content">
            <span class="close-btn" id="closeHabitModal">&times;</span>

            <h2>Add Habit</h2>
            <form id="habitForm">
                <label>
                    Habit name
                    <input type="text" name="habitName" required/>
                </label>

                <label>
                    Start date
                    <input type="date" name="startDate" required/>
                </label>

                <label>
                    Times per Weekly
                    <input type="number" name="frequency" min="1" max="7" required/>
                </label>

                <button type="submit">Save new Habit</button>
            </form>
        </div>
    </div>

    <!--Add New task form-->

    <div class="modal" id="taskModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>

            <h2>Add Task</h2>
            <form id="taskForm">
                <label>
                    Task name
                    <input type="text" name="taskName" required/>
                </label>

                <label>
                    Due date
                    <input type="date" name="dueDate" required/>
                </label>

                <select name="projectId" id="taskProject" class="taskprojectselector">
                    <option value="">No Project</option>
                </select>

                <button type="submit">Save new Task</button>
            </form>
        </div>
    </div>


    <!--Add New project form -->

     <div class="modal" id="projectkModal">
        <div class="modal-content">
            <span class="close-btn" id="closeProjectModal">&times;</span>

            <h2>Add Project</h2>
            <form id="projectForm">
                <label>
                    Project name
                    <input type="text" name="projectName" required/>
                </label>

                <label>
                    Due date
                    <input type="date" name="dueDate" required/>
                </label>

                <button type="submit">Save new project</button>
            </form>
        </div>
    </div>


<script type='module' src="js/app.js" ></script>
</body>
</html>
